{% extends 'base.html' %}
{% block title %}Feedback — Addict Aware{% endblock %}

{% block body %}
<div class="app-layout">
    <nav class="app-nav">
        <div class="app-nav-inner">
            <a href="/" class="nav-logo"><span class="logo-icon">◈</span><span class="logo-text">Addict Aware</span></a>
            <div class="app-nav-links">
                <a href="{{ url_for('user.dashboard') }}"><i class="bi bi-speedometer2"></i> Dashboard</a>
                <a href="{{ url_for('user.assessment') }}"><i class="bi bi-clipboard2-pulse"></i> Assessment</a>
                <a href="{{ url_for('user.progress') }}"><i class="bi bi-graph-up"></i> Progress</a>
                <a href="{{ url_for('user.tips') }}"><i class="bi bi-lightbulb"></i> Tips</a>
                <a href="{{ url_for('user.feedback') }}" class="active"><i class="bi bi-chat-dots"></i> Feedback</a>
            </div>
            <div class="app-nav-user">
                <a href="{{ url_for('auth.logout') }}" class="btn-logout"><i class="bi bi-box-arrow-right"></i>
                    Logout</a>
            </div>
        </div>
    </nav>

    <main class="app-main">
        <div class="container" style="max-width: 640px;">
            <div class="glass-card assessment-card">
                <div class="assessment-header">
                    <div class="assessment-icon"><i class="bi bi-chat-heart"></i></div>
                    <h1>Share Your Feedback</h1>
                    <p>Help us improve Addict Aware with your thoughts</p>
                </div>

                <form method="POST" action="{{ url_for('user.feedback') }}" class="assessment-form">
                    <div class="form-group-custom">
                        <label>How would you rate your experience?</label>
                        <div class="star-rating" id="starRating">
                            {% for i in range(1, 6) %}
                            <input type="radio" name="rating" value="{{ i }}" id="star{{ i }}" {% if i==4 %}checked{%
                                endif %}>
                            <label for="star{{ i }}" class="star-label"><i class="bi bi-star-fill"></i></label>
                            {% endfor %}
                        </div>
                    </div>

                    <div class="form-group-custom">
                        <label for="message"><i class="bi bi-pencil-square"></i> Your feedback</label>
                        <textarea name="message" id="message" class="form-input form-textarea" rows="5"
                            placeholder="Tell us what you think..." required></textarea>
                    </div>

                    <button type="submit" class="btn-auth">
                        <span>Submit Feedback</span>
                        <i class="bi bi-send"></i>
                    </button>
                </form>
            </div>
        </div>
    </main>
</div>
{% endblock %}
